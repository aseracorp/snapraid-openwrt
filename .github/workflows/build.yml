# Builds the SnapRAID OpenWrt package for every supported architecture and
# publishes an apk-format package repository to the `gh-pages` branch of the
# same repository.
#
# On each run (daily + manual, or on push to main touching the package) it:
#   1. Resolves the latest SnapRAID version from upstream.
#   2. Cross-compiles the package in a matrix over OpenWrt target SDKs.
#   3. Signs + assembles an apk repository (per-architecture dir with
#      packages.adb, its signature, the public key and the .apk) and pushes
#      it to `gh-pages`.
#
# Users install by adding the public key + repo URL (see README.md).
#
# Package signing:
#   Generate once with the OpenWrt usign tool:
#       usign -G -s APK_SIGNING_KEY -p keys/<KEYID>.pub
#   - Commit `keys/<KEYID>.pub` to this repo.
#   - Store the private key as the repo secret `APK_SIGNING_KEY`
#     (base64:  base64 < APK_SIGNING_KEY ).
#   If the secret is absent, packages are published UNSIGNED and users must
#   add the repo with `--allow-untrusted` (see README.md).

name: Build & publish

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package/**'
      - '.github/workflows/**'
      - 'keys/**'

concurrency:
  group: snapraid-openwrt-build
  cancel-in-progress: true

env:
  OPENWRT_RELEASE: 25.12.5
  KEYID: 0e9e520c9ec791cf        # matches keys/0e9e520c9ec791cf.pub

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - id: get
        run: |
          set -euo pipefail
          VER="$(curl -sL https://api.github.com/repos/amadvance/snapraid/releases/latest | jq -r '.tag_name // empty' | sed 's/^v//')"
          if [ -z "$VER" ]; then
            echo "::error::could not resolve upstream SnapRAID version"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved SnapRAID version: $VER"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk_target:
          - x86/64
          - x86/generic
          - armsr/armv8
          - armsr/armv7
          - ramips/mt7621
          - mediatek/filogic
          - octeon/generic
          - mpc85xx/p1010
    steps:
      - name: Checkout feed
        uses: actions/checkout@v4
        with:
          path: feed

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libncurses-dev zlib1g-dev gawk gettext \
            libssl-dev xsltproc rsync wget unzip zstd python3 jq curl bzip2 patch

      - name: Download & extract OpenWrt SDK (${{ matrix.sdk_target }})
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${{ matrix.sdk_target }}/"
          SDK="$(curl -fsSL "$BASE" | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | grep -v sha256 | head -1)"
          [ -n "$SDK" ] || { echo "::error::no SDK found for SDK ${{ matrix.sdk_target }}"; exit 1; }
          curl -fsSL "$BASE/$SDK" -o /tmp/sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C sdk --strip-components=1

      - name: Install package into SDK
        run: |
          set -euo pipefail
          mkdir -p sdk/package/snapraid
          cp -r feed/package/snapraid/Makefile sdk/package/snapraid/Makefile
          echo "CONFIG_PACKAGE_snapraid=y" > sdk/.config

      - name: Build snapraid
        run: |
          cd sdk
          make defconfig >/dev/null 2>&1
          make package/snapraid/compile 2>&1 | tail -30

      - name: Generate package index
        run: |
          cd sdk
          make package/index 2>&1 | tail -10

      - name: Determine arch, sign & stage repo
        run: |
          set -euo pipefail
          cd sdk
          ARCH="$(ls bin/packages | head -1)"
          echo "Architecture: $ARCH"
          REPO="bin/packages/$ARCH/base"

          # Optional index signing with the repo's private key (secret).
          if [ -n "${APK_SIGNING_KEY:-}" ]; then
            echo "$APK_SIGNING_KEY" | base64 -d > /tmp/sign.key
            chmod 600 /tmp/sign.key
            usign="$(find staging_dir/host -type f -name usign | head -1)"
            "$usign" -S -s /tmp/sign.key -m "$REPO/packages.adb"
          fi

          # Stage minimal arch repo: index(+sig) + public key + the apk
          rm -rf /tmp/stage && mkdir -p "/tmp/stage/$ARCH" "/tmp/stage/keys"
          cp "$REPO/packages.adb" "/tmp/stage/$ARCH/"
          cp "$REPO/packages.adb.sig" "/tmp/stage/$ARCH/" 2>/dev/null || true
          cp "$REPO"/*.apk "/tmp/stage/$ARCH/"
          cp ../feed/keys/"$KEYID".pub "/tmp/stage/$ARCH/"

          echo "ARCH=$ARCH" >> "$GITHUB_ENV"
          ls -la "/tmp/stage/$ARCH/"

      - name: Upload arch repo
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.sdk_target }}
          path: /tmp/stage/${{ env.ARCH }}/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download all arch repos
        uses: actions/download-artifact@v4
        with:
          path: pkgs

      - name: Assemble + commit repo tree
        run: |
          set -euo pipefail
          cd site
          # clear previous package dirs but keep top-level README
          for d in */; do
            [ "$d" = "README.md" ] && continue
            case "$d" in
              *.md|*.txt) continue ;;
            esac
            rm -rf "$d"
          done
          cd ..
          for d in pkgs/*/; do
            [ -d "$d" ] || continue
            cp -r "$d"/. site/
          done
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish snapraid package repo"
            git push
            echo "pushed"
          else
            echo "no changes to publish"
          fi
