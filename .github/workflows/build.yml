# Builds the SnapRAID OpenWrt package for every supported architecture and
# publishes an apk-format package repository to the `gh-pages` branch of the
# same repository.
#
# Triggered daily + on manual dispatch + on push to main touching the package.
# Each run first checks whether upstream SnapRAID has published a NEW release
# since the last build (compared against the `latest-version` marker on the
# gh-pages branch). If nothing changed, the build matrix is skipped — so the
# daily cron only costs a single lightweight HTTP check on most days. When a
# new version is detected it:
#   1. Resolves the latest SnapRAID version from upstream.
#   2. Cross-compiles the package in a matrix over OpenWrt target SDKs.
#   3. Signs + assembles an apk repository (per-architecture dir with
#      packages.adb, its signature, the public key and the .apk) and pushes
#      it to `gh-pages`, together with the `latest-version` marker.
#
# Users install by adding the public key + repo URL (see README.md).
#
# Package signing:
#   Generate once with the OpenWrt usign tool:
#       usign -G -s APK_SIGNING_KEY -p keys/<KEYID>.pub
#   - Commit `keys/<KEYID>.pub` to this repo.
#   - Store the private key as the repo secret `APK_SIGNING_KEY`
#     (base64:  base64 < APK_SIGNING_KEY ).
#   If the secret is absent, packages are published UNSIGNED and users must
#   add the repo with `--allow-untrusted` (see README.md).

name: Build & publish

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if upstream SnapRAID version is unchanged'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'package/**'
      - '.github/workflows/**'
      - 'keys/**'

permissions:
  contents: write

concurrency:
  group: snapraid-openwrt-build
  cancel-in-progress: true

env:
  OPENWRT_RELEASE: 25.12.5
  KEYID: dc721b66b4af2424        # matches keys/dc721b66b4af2424.pub (ECDSA P-256)
  APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}   # ECDSA P-256 private key (PEM, base64)

jobs:
  # Lightweight gate: resolve the latest upstream version and compare it with
  # the version we last published (stored in `latest-version` on gh-pages).
  # The expensive build matrix below only runs when they differ.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      changed: ${{ steps.get.outputs.changed }}
    steps:
      - id: get
        run: |
          set -euo pipefail

          # Latest upstream SnapRAID release.
          VER="$(curl -sL https://api.github.com/repos/amadvance/snapraid/releases/latest | jq -r '.tag_name // empty' | sed 's/^v//')"
          [ -n "$VER" ] || { echo "::error::could not resolve upstream SnapRAID version"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved latest upstream SnapRAID version: $VER"

          # Version we last published. Use the contents API (not
          # raw.githubusercontent) to avoid CDN staleness. 404 => never built yet.
          RAW="$(curl -fsSL "https://api.github.com/repos/aseracorp/snapraid-openwrt/contents/latest-version?ref=gh-pages" 2>/dev/null || true)"
          LAST="$(printf '%s' "$RAW" | jq -r '.content // empty' | base64 -d 2>/dev/null | tr -d '[:space:]' || true)"

          if [ -n "$LAST" ] && [ "$VER" = "$LAST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream release (${VER} already published). Skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version (${VER}) vs last published (${LAST:-none}). Building."
          fi

  build:
    needs: version
    if: needs.version.outputs.changed == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_target: x86/64
            id: x86_64
          - sdk_target: x86/generic
            id: x86_generic
          - sdk_target: x86/legacy
            id: x86_legacy
          - sdk_target: armsr/armv8
            id: armsr_armv8
          - sdk_target: mediatek/filogic
            id: mtk_filogic
          - sdk_target: bcm27xx/bcm2711
            id: bcm2711
          - sdk_target: bcm27xx/bcm2712
            id: bcm2712
          - sdk_target: bcm27xx/bcm2708
            id: bcm2708
          - sdk_target: at91/sam9x
            id: at91_sam9x
          - sdk_target: ipq806x/generic
            id: ipq806x
          - sdk_target: at91/sama5
            id: at91_sama5
          - sdk_target: mediatek/mt7629
            id: mt7629
          - sdk_target: ipq40xx/generic
            id: ipq40xx
          - sdk_target: at91/sama7
            id: at91_sama7
          - sdk_target: sunxi/cortexa8
            id: sunxi_a8
          - sdk_target: bcm53xx/generic
            id: bcm53xx
          - sdk_target: zynq/generic
            id: zynq
          - sdk_target: mvebu/cortexa9
            id: mvebu_a9
          - sdk_target: gemini/generic
            id: gemini
          - sdk_target: kirkwood/generic
            id: kirkwood
          - sdk_target: ixp4xx/generic
            id: ixp4xx
          - sdk_target: loongarch64/generic
            id: loongarch64
          - sdk_target: malta/be64
            id: malta_be64
          - sdk_target: octeon/generic
            id: octeon
          - sdk_target: malta/le64
            id: malta_le64
          - sdk_target: ath79/generic
            id: ath79
          - sdk_target: bmips/bcm6328
            id: bcm6328
          - sdk_target: ramips/mt7621
            id: mt7621
          - sdk_target: pistachio/generic
            id: pistachio
          - sdk_target: bcm47xx/mips74k
            id: bcm47xx_74k
          - sdk_target: bcm47xx/generic
            id: bcm47xx
          - sdk_target: qoriq/generic
            id: qoriq
          - sdk_target: apm821xx/nand
            id: apm821xx
          - sdk_target: mpc85xx/p2020
            id: mpc85xx_p2020
          - sdk_target: d1/generic
            id: d1

    steps:
      - name: Checkout feed
        uses: actions/checkout@v4
        with:
          path: feed

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libncurses-dev zlib1g-dev gawk gettext \
            libssl-dev xsltproc rsync wget unzip zstd python3 jq curl bzip2 patch

      # OpenWrt SDKs are large (~200-400MB) and pinned to OPENWRT_RELEASE, so
      # cache the tarball per target — the daily rebuild cost drops to a cache
      # restore, and the key auto-invalidates when the release bumps.
      - name: Cache OpenWrt SDK (${{ matrix.sdk_target }})
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /tmp/sdk.tar.zst
          key: openwrt-sdk-${{ env.OPENWRT_RELEASE }}-${{ matrix.sdk_target }}

      - name: Download & extract OpenWrt SDK (${{ matrix.sdk_target }})
        run: |
          set -euo pipefail
          if [ ! -f /tmp/sdk.tar.zst ]; then
            BASE="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${{ matrix.sdk_target }}/"
            SDK="$(curl -fsSL "$BASE" | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | grep -v sha256 | head -1)"
            [ -n "$SDK" ] || { echo "ERROR: no SDK found for target ${{ matrix.sdk_target }}"; exit 1; }
            curl -fsSL "$BASE/$SDK" -o /tmp/sdk.tar.zst
          fi
          mkdir -p sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C sdk --strip-components=1

      - name: Install package into SDK
        run: |
          set -euo pipefail
          mkdir -p sdk/package/snapraid
          cp feed/package/snapraid/Makefile sdk/package/snapraid/Makefile
          echo "CONFIG_PACKAGE_snapraid=y" > sdk/.config
          if [ -n "${APK_SIGNING_KEY:-}" ]; then
            echo "$APK_SIGNING_KEY" | base64 -d > sdk/private-key.pem
            chmod 600 sdk/private-key.pem
          fi

      - name: Build snapraid
        run: |
          cd sdk
          make defconfig >/dev/null 2>&1
          make package/snapraid/compile 2>&1 | tail -30

      - name: Generate package index
        run: |
          cd sdk
          make package/index 2>&1 | tail -10

      - name: Determine arch, sign & stage repo
        run: |
          set -euo pipefail
          cd sdk
          ARCH="$(ls bin/packages | head -1)"
          echo "Architecture: $ARCH"
          REPO="bin/packages/$ARCH/base"
          rm -rf /tmp/stage && mkdir -p "/tmp/stage/$ARCH"
          cp "$REPO/packages.adb" "/tmp/stage/$ARCH/"
          cp "$REPO"/*.apk "/tmp/stage/$ARCH/"
          cp ../feed/keys/"$KEYID".pub "/tmp/stage/$ARCH/"
          echo "ARCH=$ARCH" >> "$GITHUB_ENV"
          ls -la "/tmp/stage/$ARCH/"

      - name: Upload arch repo
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.id }}
          path: /tmp/stage/
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.changed == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Download all arch repos
        uses: actions/download-artifact@v4
        with:
          path: pkgs

      - name: Assemble + commit repo tree
        run: |
          set -euo pipefail
          cd site
          # clear previous package dirs but keep top-level README & the version marker
          for d in */; do
            case "$d" in
              README.md|latest-version|*.txt) continue ;;
              */) rm -rf "$d" ;;
            esac
          done
          cd ..
          for d in pkgs/*/; do
            [ -d "$d" ] || continue
            cp -r "$d"/. site/
          done
          # stamp the version we just published so the next cron run can
          # detect (and skip) an unchanged upstream release
          echo "${{ needs.version.outputs.version }}" > site/latest-version
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish snapraid package repo (v${{ needs.version.outputs.version }})"
            git push
            echo "pushed"
          else
            echo "no changes to publish"
          fi
